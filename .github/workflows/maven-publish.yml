name: Java CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Unit Tests
        run: mvn test

      - name: Build Project
        run: mvn clean package

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR Token
        id: acr-token
        run: |
          TOKEN=$(az acr login \
            --name azptstacraks01 \
            --expose-token \
            --output tsv \
            --query accessToken)

          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Docker Login to ACR
        run: |
          docker login azptstacraks01.azurecr.io \
            --username 00000000-0000-0000-0000-000000000000 \
            --password "$TOKEN"

      - name: Verify Azure Context
        run: |
          az account show
          az acr show --name azptstacraks01
          az acr repository list --name azptstacraks01

      - name: Build Docker Image
        run: |
          docker build -t azptstacraks01.azurecr.io/calculator-app:${{ github.run_number }} .
          docker tag azptstacraks01.azurecr.io/calculator-app:${{ github.run_number }} azptstacraks01.azurecr.io/calculator-app:latest

      - name: Push Docker Image
        run: |
          docker push azptstacraks01.azurecr.io/calculator-app:${{ github.run_number }}
          docker push azptstacraks01.azurecr.io/calculator-app:latest

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-jar
          path: target/*.jar
